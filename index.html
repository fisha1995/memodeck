<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>MemoDeck — учи каждый день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff8f0;--ink:#20243a;--muted:#777b91;--orange:#ff7a35;--pink:#ffb6cb;--purple:#8c7bff;--mint:#a9efd0;--yellow:#ffe58a;--line:#f0e5dc;--white:#fff;--shadow:0 10px 28px #4b31530e}
*{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 8% 0%,#ffe6ef 0,transparent 25%),radial-gradient(circle at 100% 18%,#e4e0ff 0,transparent 28%);background-repeat:no-repeat,no-repeat;background-size:100% 620px,100% 620px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:780px;margin:auto;padding:18px 17px 24px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.brand{font-size:26px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--orange)}.tagline{font-size:12px;color:var(--muted);margin-top:3px}.avatar{width:48px;height:48px;border-radius:18px;background:linear-gradient(145deg,#ffd3df,#dcd5ff);display:grid;place-items:center;font-size:27px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:23px 20px 20px;background:linear-gradient(125deg,#ffb7cb,#ffcda7 52%,#ffe68c);box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:"✨";position:absolute;font-size:78px;right:14px;top:13px;transform:rotate(12deg);opacity:.8}.hero h1{font-size:29px;line-height:1.08;letter-spacing:-1px;margin:0 90px 9px 0}.hero p{margin:0 70px 16px 0;line-height:1.4;color:#5b3f4c;font-weight:600;font-size:14px}.hero .cta{background:#fff;color:#30233a;border-radius:14px;padding:12px 15px;font-weight:850;box-shadow:0 4px 0 #df9c9b}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 23px}.stat{background:#ffffffd9;border:1px solid #fff;border-radius:18px;padding:13px 10px;box-shadow:var(--shadow)}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted);font-weight:650}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 12px}.head h2{font-size:21px;letter-spacing:-.5px;margin:0}.link{background:transparent;color:#7c64e8;font-weight:850;padding:7px}
.deck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.deck{min-width:0;background:white;border-radius:22px;overflow:hidden;border:1px solid #fff;box-shadow:var(--shadow)}.cover{height:125px;padding:13px;display:flex;align-items:flex-start;justify-content:space-between;position:relative;overflow:hidden}.cover:after{content:attr(data-art);position:absolute;font-size:64px;right:8px;bottom:0;filter:drop-shadow(0 5px 3px #3332)}.cover .badge{background:#ffffffb8;border-radius:30px;padding:6px 9px;font-size:11px;font-weight:850;z-index:1}.deck-body{padding:13px}.deck-title{font-weight:900;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:7px;margin-top:12px}.mini{flex:1;background:#f6f1ff;color:#5d4bb3;border-radius:11px;padding:9px 5px;font-size:11px;font-weight:850}.primary{background:var(--ink);color:white;border-radius:15px;padding:14px 16px;font-weight:850}.orange{background:var(--orange);color:white}.soft{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:800}.full{width:100%}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffdf9ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:780px;margin:auto}.tab{background:transparent;color:#88899a;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 1px;font-size:10px;font-weight:800}.tab .ico{font-size:21px}.tab.active{color:var(--orange)}
.panel{background:#fff;border:1px solid #fff;border-radius:24px;padding:17px;box-shadow:var(--shadow)}.progressline{height:7px;background:#f1eae4;border-radius:9px;overflow:hidden;margin:10px 0 16px}.progressline div{height:100%;background:linear-gradient(90deg,var(--orange),#ffbd66);width:0}.flashcard{min-height:310px;width:100%;background:linear-gradient(145deg,#fff9fd,#f0edff);border:1px solid #e8e0ff;border-radius:25px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.pill{background:#fff;color:#7866c6;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:900;position:absolute;top:14px}.flash-art{font-size:40px}.flash-main{font-size:30px;font-weight:950;line-height:1.2;overflow-wrap:anywhere;margin:17px 0 10px}.hint{font-size:13px;color:var(--muted);line-height:1.45}.answer{font-size:22px;font-weight:850;color:#24835b;margin:10px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.good,.again{border-radius:14px;padding:14px;font-weight:900}.good{background:#dff8e9;color:#19744a}.again{background:#fff0df;color:#a65a1e}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid #e9e0d8;border-radius:13px;padding:13px;background:#fffdfb;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.empty{text-align:center;padding:25px 12px;color:var(--muted)}.premium{background:linear-gradient(145deg,#2e2557,#6b4cd5);color:white;border-radius:25px;padding:22px;position:relative;overflow:hidden}.premium:after{content:"👑";position:absolute;font-size:76px;right:16px;top:15px}.premium h2{font-size:25px;margin:0 95px 8px 0}.premium p{font-size:13px;line-height:1.45;color:#e5ddff;margin:0 80px 17px 0}.feature{padding:12px 0;border-bottom:1px solid #f0e9ff;font-weight:750}.feature:last-child{border:0}.notice{background:#fff4d7;border:1px solid #ffe5a2;border-radius:14px;padding:12px;font-size:12px;line-height:1.45;color:#705422;margin-top:12px}
@media(min-width:600px){.deck-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h1{font-size:36px}}
</style>
</head>
<body><main class="app" id="app"></main><nav class="tabs" id="tabs"></nav>
<script>
const tg=window.Telegram?.WebApp; try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#fff8f0');tg?.setBackgroundColor?.('#fff8f0')}catch(e){}
const starter=[
{id:'everyday',title:'Everyday English',emoji:'🌈',colors:['#ffd0dc','#ffe6a7'],cards:[['How’s it going?','Как дела?','👋'],['I’m looking forward to it.','Я с нетерпением этого жду.','🎉'],['That makes sense.','Это логично.','💡'],['Could you give me a hand?','Можешь мне помочь?','🤝'],['I’m getting used to it.','Я привыкаю к этому.','🌱'],['It depends.','Это зависит.','🎲'],['No worries.','Не переживай / ничего страшного.','😊'],['I’ll figure it out.','Я разберусь.','🧩'],['What do you mean?','Что ты имеешь в виду?','❓'],['Sounds good to me.','Меня устраивает.','👍'],['I can’t seem to do it.','У меня никак не получается это сделать.','😅'],['Put it off.','Отложить это.','📅'],['Pick it up.','Поднять / забрать / подхватить.','🪄'],['Let’s keep in touch.','Давай оставаться на связи.','💌']]},
{id:'travel',title:'Travel & Adventure',emoji:'✈️',colors:['#b6e8ff','#c9f7df'],cards:[['Where is the nearest station?','Где ближайшая станция?','🚉'],['I have a reservation.','У меня есть бронь.','🧳'],['Could I see the menu?','Можно меню?','🍽️'],['How much does it cost?','Сколько это стоит?','💶']]},
{id:'daily',title:'Daily Life',emoji:'☀️',colors:['#ffe28c','#ffcda8'],cards:[['I’m running late.','Я опаздываю.','⏰'],['Take your time.','Не торопись.','🐢'],['It’s up to you.','Решать тебе.','🎯']]},
{id:'work',title:'Work & Career',emoji:'🚀',colors:['#d8c9ff','#ffc8e6'],cards:[['Let me check.','Дай мне проверить.','🔎'],['I’ll get back to you.','Я свяжусь с тобой позже.','📨'],['Could you clarify that?','Можешь это уточнить?','🧠']]}
];
let state={decks:[],tab:'home',deckId:'everyday',idx:0,flipped:false,query:'',premium:false};
try{const saved=JSON.parse(localStorage.getItem('memodeck_v2')||'null');if(saved&&saved.decks?.length)state.decks=saved.decks;else state.decks=starter.map(x=>({...x,cards:x.cards.map((c,i)=>({id:x.id+'-'+i,q:c[0],a:c[1],emoji:c[2],known:false}))}));}catch(e){state.decks=starter.map(x=>({...x,cards:x.cards.map((c,i)=>({id:x.id+'-'+i,q:c[0],a:c[1],emoji:c[2],known:false}))}));}
function save(){try{localStorage.setItem('memodeck_v2',JSON.stringify({decks:state.decks,premium:state.premium}))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deck(){return state.decks.find(d=>d.id===state.deckId)||state.decks[0]}
function render(){const all=state.decks.reduce((n,d)=>n+d.cards.length,0),known=state.decks.reduce((n,d)=>n+d.cards.filter(c=>c.known).length,0);
document.getElementById('tabs').innerHTML=[['home','🏡','Главная'],['drill','🧠','Учить'],['decks','🎨','Колоды'],['library','📚','Карточки'],['premium','👑','Premium']].map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" onclick="go('${t[0]}')"><span class="ico">${t[1]}</span>${t[2]}</button>`).join('');
let html=`<header class="top"><div><div class="brand">Memo<span>Deck</span> ✨</div><div class="tagline">Маленькие шаги — большой прогресс</div></div><div class="avatar">🦊</div></header>`;
if(state.tab==='home')html+=`<section class="hero"><h1>Твой английский. Твой темп.</h1><p>Яркие карточки, новые слова и ежедневные маленькие победы 💛</p><button class="cta" onclick="go('drill')">Начать занятие →</button></section><div class="stats"><div class="stat"><b>${all}</b><span>карточек</span></div><div class="stat"><b>${known}</b><span>знаю</span></div><div class="stat"><b>${state.decks.length}</b><span>колод</span></div></div><div class="head"><h2>Твои колоды 🎨</h2><button class="link" onclick="go('decks')">Все →</button></div>${deckCards()}<div class="head"><h2>Продолжим?</h2></div><button class="primary orange full" onclick="go('drill')">🧠 Повторять слова</button>`;
if(state.tab==='decks')html+=`<div class="head"><h2>Мои колоды 🎨</h2><button class="primary orange" onclick="newDeck()">＋ Создать</button></div>${deckCards(true)}`;
if(state.tab==='library')html+=`<div class="head"><h2>Карточки 📚</h2><button class="primary orange" onclick="newCard()">＋ Добавить</button></div><input class="field search" placeholder="🔎 Найти слово или перевод" value="${esc(state.query)}" oninput="state.query=this.value;render()">${state.decks.map(d=>d.cards.filter(c=>(c.q+' '+c.a).toLowerCase().includes(state.query.toLowerCase())).map(c=>`<div class="panel" style="margin:9px 0;display:flex;gap:12px;align-items:center"><div style="font-size:28px">${c.emoji||'💬'}</div><div style="flex:1;min-width:0"><b>${esc(c.q)}</b><div class="meta">${esc(c.a)} · ${esc(d.title)}</div></div><button class="mini" onclick="editCard('${d.id}','${c.id}')">Изменить</button><button class="mini" onclick="deleteCard('${d.id}','${c.id}')">✕</button></div>`).join('')).join('')||'<div class="empty">Пока нет карточек</div>'}`;
if(state.tab==='drill'){const d=deck(),c=d?.cards[state.idx%d.cards.length];html+=`<div class="head"><h2>🧠 Время повторять</h2><button class="link" onclick="go('decks')">Сменить колоду</button></div>${d&&c?`<div class="meta">${esc(d.title)} · ${state.idx+1} из ${d.cards.length}</div><div class="progressline"><div style="width:${((state.idx+1)/d.cards.length)*100}%"></div></div><button class="flashcard" onclick="flip()"><span class="pill">${state.flipped?'ОТВЕТ':'ВОПРОС'}</span><div class="flash-art">${c.emoji||d.emoji}</div><div class="flash-main">${esc(state.flipped?c.a:c.q)}</div><div class="hint">${state.flipped?'Нажми «Знаю» или повтори позже':'Нажми на карточку, чтобы увидеть перевод'}</div></button><div class="controls"><button class="again" onclick="next(false)">🔁 Повторить</button><button class="good" onclick="next(true)">✨ Знаю!</button></div>`:'<div class="empty">Добавь карточки, чтобы начать.</div>'}`;
if(state.tab==='premium')html+=`<section class="premium"><h2>MemoDeck Premium</h2><p>Больше возможностей для больших целей ✨</p><button class="cta" onclick="subscribe()">Открыть Premium 👑</button></section><div class="panel" style="margin-top:14px"><div class="feature">🌈 Больше колод и карточек</div><div class="feature">🧠 Умное интервальное повторение</div><div class="feature">📈 Подробная статистика обучения</div><div class="feature">☁️ Синхронизация между устройствами — после подключения аккаунта</div><div class="notice">Оплата ещё не подключена. Для настоящей подписки Telegram Stars нужно настроить серверную часть бота и проверку платежей. Пока кнопка не списывает деньги.</div></div>`;
document.getElementById('app').innerHTML=html;}
function deckCards(all=false){return `<div class="deck-grid">${state.decks.slice(0,all?99:4).map(d=>`<article class="deck"><div class="cover" data-art="${d.emoji}" style="background:linear-gradient(135deg,${d.colors?.[0]||'#ffd0dc'},${d.colors?.[1]||'#ffe6a7'})"><span class="badge">${d.cards.length} карточек</span></div><div class="deck-body"><div class="deck-title">${esc(d.title)}</div><div class="meta">${d.cards.filter(c=>c.known).length} уже знаю · ${d.cards.length} всего</div><div class="actions"><button class="mini" onclick="startDeck('${d.id}')">Учить</button><button class="mini" onclick="addToDeck('${d.id}')">＋ Слово</button><button class="mini" onclick="renameDeck('${d.id}')">✎</button></div></div></article>`).join('')}</div>`}
function go(t){state.tab=t;render()}function startDeck(id){state.deckId=id;state.idx=0;state.flipped=false;go('drill')}function flip(){state.flipped=!state.flipped;render()}function next(known){const d=deck(),c=d?.cards[state.idx%d.cards.length];if(c&&known)c.known=true;if(d?.cards.length)state.idx=(state.idx+1)%d.cards.length;state.flipped=false;save();render()}
function newDeck(){let title=prompt('Название новой колоды:');if(!title?.trim())return;const id='deck-'+Date.now();state.decks.push({id,title:title.trim(),emoji:'🌟',colors:['#d8c9ff','#ffc8e6'],cards:[]});state.deckId=id;save();render()}
function renameDeck(id){const d=state.decks.find(x=>x.id===id);if(!d)return;const title=prompt('Название колоды:',d.title);if(title?.trim()){d.title=title.trim();save();render()}}
function addToDeck(id){state.deckId=id;newCard()}
function newCard(){const d=deck();if(!d){alert('Сначала создай колоду');return}const q=prompt('Слово или фраза на английском:');if(!q?.trim())return;const a=prompt('Перевод на русский:');if(!a?.trim())return;const emoji=prompt('Эмодзи для карточки (необязательно):','💬')||'💬';d.cards.push({id:'c-'+Date.now(),q:q.trim(),a:a.trim(),emoji,known:false});save();go('library')}
function editCard(did,cid){const d=state.decks.find(x=>x.id===did),c=d?.cards.find(x=>x.id===cid);if(!c)return;const q=prompt('Английский текст:',c.q);if(!q?.trim())return;const a=prompt('Перевод:',c.a);if(!a?.trim())return;c.q=q.trim();c.a=a.trim();save();render()}
function deleteCard(did,cid){if(!confirm('Удалить карточку?'))return;const d=state.decks.find(x=>x.id===did);if(d)d.cards=d.cards.filter(c=>c.id!==cid);save();render()}
function subscribe(){alert('Подписка пока не подключена. Для реальных платежей Telegram Stars нужен backend: создание invoice, проверка successful_payment и управление сроком подписки. Не вводи данные карты здесь.');}
render();
</script></body></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf4">
<title>MemoDeck — учи и запоминай</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fffaf4;--card:#fff;--ink:#202431;--muted:#7d818b;--accent:#f07827;--accent2:#e9f7ec;--line:#eee8e0;--nav:#fff;--shadow:0 8px 24px #2222220a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f0782766;outline-offset:2px}
.app{max-width:780px;margin:0 auto;padding:16px 18px 22px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}.brand{font-weight:850;font-size:25px;letter-spacing:-.7px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px;margin-top:3px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fce6d5;font-size:20px}
h1{font-size:28px;letter-spacing:-.7px;margin:12px 0 6px}h2{font-size:21px;margin:0 0 12px;letter-spacing:-.3px}.lead{color:var(--muted);margin:0 0 20px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 25px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.text-btn{color:var(--accent);background:transparent;font-weight:750;padding:8px 0}
.deck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.deck{background:white;border-radius:22px;overflow:hidden;border:1px solid #eee8e0;box-shadow:var(--shadow);min-width:0}.cover{height:126px;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;font-size:42px}.cover small{font-size:12px;background:#ffffffb8;border-radius:20px;padding:6px 9px;color:#383838;font-weight:800}.deck-body{padding:13px 14px 15px}.deck-title{font-weight:800;font-size:16px;line-height:1.25;overflow-wrap:anywhere}.deck-meta{color:var(--muted);font-size:13px;margin-top:7px}.deck-actions{display:flex;gap:8px;margin-top:12px}.small-btn{border-radius:11px;background:#f5f2ed;padding:9px 10px;font-weight:700;font-size:12px;color:var(--ink)}.primary{background:var(--ink);color:white;border-radius:15px;padding:14px 17px;font-weight:800}.orange{background:var(--accent);color:white}.outline{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-weight:750;color:var(--ink)}.full{width:100%}
.search{width:100%;background:white;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0 14px}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:9px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);max-width:780px;margin:auto}.tab{background:transparent;color:#777b83;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;font-size:11px;font-weight:700}.tab .ico{font-size:22px;line-height:1.2}.tab.active{color:var(--accent)}
.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.flash-wrap{min-height:330px;display:flex;align-items:stretch;flex-direction:column;gap:14px}.flashcard{width:100%;flex:1;min-height:260px;background:linear-gradient(145deg,#fff,#fff8ef);border:1px solid #f1e6d9;border-radius:25px;padding:25px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.pill{background:#f4eee6;color:#71685f;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800;position:absolute;top:14px}.flash-main{font-size:29px;font-weight:850;line-height:1.22;overflow-wrap:anywhere;margin:22px 0 10px}.flash-hint{font-size:14px;color:var(--muted);line-height:1.4}.answer{font-size:22px;font-weight:750;color:#2b8651;margin:12px 0 5px}.drill-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.good{background:#e5f6e9;color:#197443;border-radius:14px;padding:14px;font-weight:850}.again{background:#fff0e4;color:#b45a16;border-radius:14px;padding:14px;font-weight:850}.progressline{height:6px;background:#eee9e2;border-radius:10px;overflow:hidden;margin:8px 0 16px}.progressline div{height:100%;background:var(--accent);width:0;transition:width .2s}
.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-weight:750;font-size:13px}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink);width:100%}.field textarea{min-height:85px;resize:vertical}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.empty{text-align:center;padding:30px 18px;color:var(--muted);line-height:1.5}.empty .emoji{font-size:40px;margin-bottom:10px}.list-card{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.list-card:last-child{border-bottom:0}.list-emoji{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex-shrink:0}.list-info{flex:1;min-width:0}.list-info b{display:block;overflow-wrap:anywhere}.list-info span{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.notice{background:#fff3e5;border-radius:13px;padding:12px 14px;color:#885323;font-size:13px;line-height:1.45;margin:12px 0}.toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#222431;color:white;padding:11px 16px;border-radius:12px;font-size:13px;max-width:90%;display:none}.hidden{display:none!important}.settings-item{padding:15px 0;border-bottom:1px solid var(--line)}.settings-item:last-child{border-bottom:0}.file-btn{display:inline-block;position:relative;overflow:hidden}.file-btn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
@media(min-width:600px){.app{padding:24px}.cover{height:155px}.deck-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.flash-main{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">Memo<span>Deck</span></div><div class="sub">Запоминай каждый день</div></div><div class="avatar" id="avatar">🧠</div></header>
<main id="view"></main>
</div>
<nav class="tabs">
<button class="tab active" data-tab="drilling"><span class="ico">ϟ</span><span>Drilling</span></button>
<button class="tab" data-tab="decks"><span class="ico">▱</span><span>Decks</span></button>
<button class="tab" data-tab="library"><span class="ico">▤</span><span>Library</span></button>
<button class="tab" data-tab="more"><span class="ico">•••</span><span>More</span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
(() => {
const KEY='memodeck_v1';
const seed=[
{id:'starter-phrases',title:'Everyday English',emoji:'🇬🇧',color:'#dff0ff',desc:'Полезные фразы на каждый день',source:'library',cards:[
{front:'How’s it going?',back:'Как дела?',example:'Pretty good, thanks.',known:0,seen:0},
{front:'I’m looking forward to it.',back:'Я с нетерпением этого жду.',example:'I’m looking forward to the weekend.',known:0,seen:0},
{front:'It depends.',back:'Это зависит.',example:'It depends on the weather.',known:0,seen:0},
{front:'Could you say that again?',back:'Не могли бы вы повторить?',example:'Sorry, could you say that again?',known:0,seen:0},
{front:'I can’t seem to do it.',back:'У меня никак не получается это сделать.',example:'I can’t seem to open this file.',known:0,seen:0}
]},
{id:'phrasal-verbs',title:'Phrasal Verbs',emoji:'⚡',color:'#e7f7e8',desc:'Фразовые глаголы',source:'library',cards:[
{front:'Pick up',back:'Поднять; забрать; подобрать',example:'Can you pick me up at six?',known:0,seen:0},
{front:'Put off',back:'Отложить',example:'We put off the meeting.',known:0,seen:0},
{front:'Find out',back:'Выяснить, узнать',example:'I need to find out what happened.',known:0,seen:0},
{front:'Give up',back:'Сдаться; бросить',example:'Don’t give up.',known:0,seen:0},
{front:'Put out',back:'Потушить; выставить наружу',example:'Firefighters put out the fire.',known:0,seen:0}
]},
{id:'daily-words',title:'Daily Vocabulary',emoji:'📚',color:'#f7e6ff',desc:'Слова для повседневной жизни',source:'library',cards:[
{front:'Exhausted',back:'Измотанный, очень уставший',example:'I’m exhausted after work.',known:0,seen:0},
{front:'Convenient',back:'Удобный',example:'Is tomorrow convenient for you?',known:0,seen:0},
{front:'Eventually',back:'В конце концов',example:'Eventually, everything worked out.',known:0,seen:0},
{front:'Awkward',back:'Неловкий',example:'That was an awkward moment.',known:0,seen:0}
]}
];
let state={tab:'drilling',decks:[],activeDeck:null,queue:[],index:0,revealed:false,search:'',editId:null,formDeckId:null};
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.decks))state.decks=s.decks;else state.decks=structuredClone(seed)}catch(e){state.decks=JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem(KEY,JSON.stringify({decks:state.decks}))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function allCards(){return state.decks.flatMap(d=>d.cards.map((c,i)=>({...c,deckId:d.id,deckTitle:d.title,cardIndex:i})))}
function totalKnown(){return allCards().filter(c=>c.known).length}
function getDeck(id){return state.decks.find(d=>d.id===id)}
function btn(label,action,cls='outline',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function deckCard(d){return `<article class="deck"><div class="cover" style="background:${esc(d.color||'#e8f1ff')}"><span>${esc(d.emoji||'🗂️')}</span><small>${d.cards.length} cards</small></div><div class="deck-body"><div class="deck-title">${esc(d.title)}</div><div class="deck-meta">${esc(d.desc||'Моя колода')}</div><div class="deck-actions">${btn('Учить','study:'+d.id,'small-btn')}${btn('Карточки','editcards:'+d.id,'small-btn')}${btn('Изменить','edit:'+d.id,'small-btn')}</div></div></article>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let v=document.querySelector('#view');if(state.tab==='drilling')v.innerHTML=renderDrilling();else if(state.tab==='decks')v.innerHTML=renderDecks();else if(state.tab==='library')v.innerHTML=renderLibrary();else v.innerHTML=renderMore()}
function renderDrilling(){
let cards=state.queue.length?state.queue:allCards().filter(c=>!c.known);
let c=cards[state.index];
if(!c)return `<h1>Drilling</h1><p class="lead">Тренируй память короткими подходами каждый день.</p><div class="stats"><div class="stat"><b>${allCards().length}</b><span>Всего карточек</span></div><div class="stat"><b>${totalKnown()}</b><span>Знаю</span></div><div class="stat"><b>${allCards().length-totalKnown()}</b><span>К повторению</span></div></div><div class="panel empty"><div class="emoji">🎉</div><b>На сегодня всё!</b><p>Добавь карточки или начни тренировку любой колоды.</p>${btn('Выбрать колоду','go-decks','primary full')}</div>`;
return `<h1>Drilling</h1><p class="lead">Вспомни ответ, прежде чем перевернуть карточку.</p><div class="row"><div class="muted" style="font-size:13px">${esc(c.deckTitle)}</div><div style="text-align:right;font-size:13px;font-weight:800">${state.index+1} / ${cards.length}</div></div><div class="progressline"><div style="width:${((state.index+1)/cards.length)*100}%"></div></div><div class="flash-wrap"><button class="flashcard" data-action="flip"><span class="pill">${state.revealed?'ОТВЕТ':'ВОПРОС'}</span><span class="flash-main">${esc(state.revealed?c.back:c.front)}</span>${state.revealed?`<span class="flash-hint">${esc(c.example||'')}</span>`:`<span class="flash-hint">Нажми на карточку, чтобы увидеть перевод</span>`}</button>${state.revealed?`<div class="drill-controls">${btn('↻ Повторить','again','again')}${btn('✓ Знаю','known','good')}</div>`:`<div class="row">${btn('🔊 Произнести','speak','outline full')}${btn('Показать ответ','flip','primary full')}</div>`}</div><p class="muted" style="font-size:12px;text-align:center">Подсказка: можно использовать свайп влево/вправо на карточке.</p>`;
}
function renderDecks(){return `<h1>Мои колоды</h1><p class="lead">Создавай наборы под свои цели и учи в своём темпе.</p><div class="section-head"><h2>Все колоды · ${state.decks.length}</h2>${btn('+ Создать','new-deck','primary')}</div>${state.decks.length?`<div class="deck-grid">${state.decks.map(deckCard).join('')}</div>`:`<div class="panel empty">Пока нет колод. Создай первую!</div>`}`}
function renderLibrary(){let list=state.decks.filter(d=>d.source==='library');return `<h1>Library</h1><p class="lead">Готовые наборы для старта. Добавь колоду в свои и редактируй её под себя.</p><input class="search" id="search" placeholder="Поиск колод..." value="${esc(state.search)}"><div class="deck-grid">${list.filter(d=>(d.title+' '+d.desc).toLowerCase().includes(state.search.toLowerCase())).map(d=>`<article class="deck"><div class="cover" style="background:${esc(d.color)}"><span>${esc(d.emoji)}</span><small>${d.cards.length} cards</small></div><div class="deck-body"><div class="deck-title">${esc(d.title)}</div><div class="deck-meta">${esc(d.desc)}</div><div class="deck-actions">${btn('Начать','study:'+d.id,'small-btn')}${btn('В мои колоды','copy:'+d.id,'small-btn')}</div></div></article>`).join('')}</div>`}
function renderMore(){return `<h1>More</h1><p class="lead">Настройки, перенос карточек и статистика.</p><div class="panel"><div class="stats"><div class="stat"><b>${allCards().length}</b><span>Карточек</span></div><div class="stat"><b>${totalKnown()}</b><span>Выучено</span></div><div class="stat"><b>${state.decks.length}</b><span>Колоды</span></div></div><div class="settings-item"><b>📤 Экспорт</b><p class="muted">Сохрани колоды в JSON-файл.</p><button class="outline full" data-action="export">Экспортировать данные</button></div><div class="settings-item"><b>📥 Импорт</b><p class="muted">Загрузи ранее сохранённый JSON-файл MemoDeck.</p><label class="outline full file-btn" style="text-align:center">Выбрать JSON-файл<input type="file" id="importFile" accept=".json,application/json"></label></div><div class="settings-item"><b>🔄 Сбросить прогресс</b><p class="muted">Сбросит отметки «Знаю», но не удалит колоды.</p><button class="outline full" data-action="reset-progress">Сбросить прогресс</button></div><div class="notice">Данные этой версии хранятся в локальном хранилище браузера на устройстве. Не очищай данные браузера, если хочешь сохранить прогресс. Делай экспорт время от времени.</div><div class="muted" style="font-size:12px">MemoDeck · бесплатная демонстрационная версия</div></div>`}
function switchTab(t){state.tab=t;state.queue=[];state.index=0;state.revealed=false;render()}
function startStudy(id){let d=getDeck(id);if(!d||!d.cards.length){toast('В этой колоде пока нет карточек');return}state.activeDeck=id;state.queue=d.cards.map((c,i)=>({...c,deckId:id,deckTitle:d.title,cardIndex:i})).filter(c=>!c.known);if(!state.queue.length)state.queue=d.cards.map((c,i)=>({...c,deckId:id,deckTitle:d.title,cardIndex:i}));state.index=0;state.revealed=false;state.tab='drilling';render()}
function addDeck(){state.editId=null;state.tab='decks';render();document.querySelector('#view').insertAdjacentHTML('afterbegin',formHTML());window.scrollTo(0,0)}
function formHTML(d){d=d||{title:'',emoji:'📘',color:'#e6f2ff',desc:''};return `<div class="panel" id="deckFormPanel" style="margin-bottom:18px"><h2>${state.editId?'Редактировать колоду':'Новая колода'}</h2><div class="field"><label>Название</label><input id="deckTitle" maxlength="70" placeholder="Например, English phrases" value="${esc(d.title)}"></div><div class="row"><div class="field"><label>Эмодзи</label><input id="deckEmoji" maxlength="5" value="${esc(d.emoji)}"></div><div class="field"><label>Цвет обложки</label><input id="deckColor" type="color" value="${/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#e6f2ff'}" style="height:45px;padding:4px"></div></div><div class="field"><label>Описание</label><input id="deckDesc" maxlength="140" placeholder="Коротко о колоде" value="${esc(d.desc)}"></div><div class="row">${btn('Сохранить','save-deck','primary full')}${btn('Отмена','cancel-form','outline full')}</div></div>`}
function editDeck(id){let d=getDeck(id);if(!d)return;state.editId=id;state.tab='decks';render();document.querySelector('#view').insertAdjacentHTML('afterbegin',formHTML(d));window.scrollTo(0,0)}
function openCards(id){let d=getDeck(id);if(!d)return;state.formDeckId=id;state.tab='decks';render();let v=document.querySelector('#view');v.insertAdjacentHTML('afterbegin',`<div class="panel" id="cardForm"><h2>Карточки: ${esc(d.title)}</h2><div id="cardList">${d.cards.map((c,i)=>`<div class="list-card"><div class="list-info"><b>${esc(c.front)}</b><span>${esc(c.back)}</span></div><button class="small-btn" data-action="delete-card:${i}">Удалить</button></div>`).join('')||'<p class="muted">Карточек пока нет.</p>'}</div><div class="field"><label>Английская фраза / вопрос</label><input id="newFront" placeholder="I can’t seem to do it."></div><div class="field"><label>Перевод / ответ</label><input id="newBack" placeholder="У меня никак не получается это сделать"></div><div class="field"><label>Пример (необязательно)</label><input id="newExample" placeholder="I can’t seem to open it."></div><div class="row">${btn('+ Добавить карточку','add-card','primary full')}${btn('Готово','cancel-form','outline full')}</div></div>`);window.scrollTo(0,0)}
document.addEventListener('click',e=>{
let tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}
let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
if(a==='flip'){state.revealed=!state.revealed;render()}
else if(a==='speak'){let c=(state.queue.length?state.queue:allCards())[state.index];if(c&&'speechSynthesis'in window){let u=new SpeechSynthesisUtterance(c.front);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}else toast('Озвучка недоступна в этом браузере')}
else if(a==='known'||a==='again'){let cards=state.queue.length?state.queue:allCards().filter(c=>!c.known);let c=cards[state.index];if(c){let d=getDeck(c.deckId);let target=d.cards[c.cardIndex];target.seen=(target.seen||0)+1;if(a==='known')target.known=1;else target.known=0;save();state.revealed=false;if(a==='again'&&state.queue.length){state.queue.push(c)}state.index++;if(state.index>=(state.queue.length?state.queue.length:allCards().filter(x=>!x.known).length)){state.queue=[];state.index=0}render()}}
else if(a.startsWith('study:'))startStudy(a.split(':')[1]);
else if(a==='go-decks')switchTab('decks');
else if(a==='new-deck')addDeck();
else if(a.startsWith('edit:'))editDeck(a.split(':')[1]);
else if(a==='cancel-form'){state.editId=null;state.formDeckId=null;render()}
else if(a==='save-deck'){let title=document.querySelector('#deckTitle')?.value.trim();if(!title){toast('Введи название колоды');return}let obj={title,emoji:document.querySelector('#deckEmoji').value.trim()||'📘',color:document.querySelector('#deckColor').value,desc:document.querySelector('#deckDesc').value.trim(),source:'custom',cards:[]};if(state.editId){let d=getDeck(state.editId);Object.assign(d,{title:obj.title,emoji:obj.emoji,color:obj.color,desc:obj.desc});state.editId=null}else{obj.id='custom-'+Date.now();state.decks.unshift(obj)}save();render();toast('Колода сохранена')}
else if(a.startsWith('copy:')){let d=getDeck(a.split(':')[1]);if(d){let cp=JSON.parse(JSON.stringify(d));cp.id='copy-'+Date.now();cp.title+=' (моя копия)';cp.source='custom';state.decks.unshift(cp);save();toast('Колода добавлена');render()}}
else if(a.startsWith('editcards:'))openCards(a.split(':')[1]);
else if(a.startsWith('delete-card:')){let d=getDeck(state.formDeckId);if(d){d.cards.splice(Number(a.split(':')[1]),1);save();openCards(d.id)}}
else if(a==='add-card'){let d=getDeck(state.formDeckId),front=document.querySelector('#newFront').value.trim(),back=document.querySelector('#newBack').value.trim(),example=document.querySelector('#newExample').value.trim();if(!front||!back){toast('Заполни фразу и перевод');return}d.cards.push({front,back,example,known:0,seen:0});save();openCards(d.id);toast('Карточка добавлена')}
else if(a==='export'){let blob=new Blob([JSON.stringify({decks:state.decks},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='memodeck-backup.json';link.click();URL.revokeObjectURL(url)}
else if(a==='reset-progress'){if(confirm('Сбросить отметки «Знаю» у всех карточек?')){state.decks.forEach(d=>d.cards.forEach(c=>{c.known=0;c.seen=0}));save();render();toast('Прогресс сброшен')}}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;state.search=e.target.value;let v=document.querySelector('#view');let y=window.scrollY;render();let n=document.querySelector('#search');n.focus();n.setSelectionRange(pos,pos);window.scrollTo(0,y)}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.decks))throw Error();if(confirm('Заменить текущие колоды импортированными?')){state.decks=obj.decks;save();render();toast('Импорт завершён')}}catch(err){toast('Не удалось прочитать файл MemoDeck JSON')}};r.readAsText(f)}});
let touchX=0;document.addEventListener('touchstart',e=>{if(e.target.closest('.flashcard'))touchX=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(!e.target.closest('.flashcard'))return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>70&&state.revealed){let act=dx>0?'known':'again';document.querySelector(`[data-action="${act}"]`)?.click()}},{passive:true});
document.addEventListener('click',e=>{let fc=e.target.closest('.flashcard');if(fc&&state.revealed===false){/* card click handled by flip button */}});
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#fffaf4');tg.setBackgroundColor('#fffaf4');if(tg.initDataUnsafe?.user?.first_name)document.querySelector('#avatar').textContent='👋'}catch(e){}}
load();render();
})();
</script>
</body>
</html>
